<h1>Mitglied Details</h1>

@if (this.member.hasValue()) {
  <form (submit)="onSubmit($event)">
    <input type="text" [formField]="memberForm.id" />
    <input type="text" [formField]="memberForm.first_name" />
    <input type="text" [formField]="memberForm.last_name" />
    <input type="text" [formField]="memberForm.age" />
    <button type="submit">Bearbeiten</button>
  </form>
}
